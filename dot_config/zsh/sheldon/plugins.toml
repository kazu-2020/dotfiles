shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zeno]
github = "yuki-yano/zeno.zsh"
apply = ["defer"]
[plugins.zeno.hooks]
pre = "zsh-defer source $ZDOTDIR/hooks/zeno-pre.zsh"
post = "zsh-defer source $ZDOTDIR/hooks/zeno-post.zsh"

[plugins.compinit]
inline = """
# ディレクトリが無いと compinit は dump を黙って作らず、毎回フルスキャンになる。
# 2 回目以降の起動で fork しないよう組み込みの [[ -d ]] でガードする。
: "${XDG_STATE_HOME:=$HOME/.local/state}"
[[ -d $XDG_STATE_HOME/zsh ]] || mkdir -p $XDG_STATE_HOME/zsh

# 補完の設定は compinit より前に済ませておく。
# fzf-tab はグループ名に compadd の説明文字列 ($expl) を使うので、
# descriptions format が無いと $expl が空になりグループ表示が機能しない。
zstyle ':completion:*:descriptions' format '[%d]'
# fzf-tab 自体は menu zstyle を参照しない。現状 menu select も MENU_COMPLETE も
# 設定していないので実質 no-op だが、将来入れたときに標準メニューと二重にならない保険。
zstyle ':completion:*' menu no
# cd 補完時にディレクトリの中身をプレビューする
zstyle ':fzf-tab:complete:cd:*' fzf-preview 'eza --icons --tree --level=1 --color=always $realpath'

autoload -Uz compinit
zsh-defer -a -t0.01 compinit -d "$XDG_STATE_HOME/zsh/zcompdump"
"""
# see: https://github.com/Aloxaf/fzf-tab?tab=readme-ov-file#install
# loaded after compinit
# before plugins such as autosuggestion, fast-syntax-highlighting
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
apply = ["defer"]

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["defer", "fpath"]

[plugins.async]
inline = """
zsh-defer source "$ZDOTDIR/hooks/async.zsh"
"""

# pure は git 情報を zsh-async で非同期に取るため、プロンプトの描画が git の完了を
# 待たない。starship のようにプロンプトのたびにバイナリを fork することもない。
#
# defer しないこと。遅延させると最初のプロンプトが素の "%" で描画されてから
# pure に差し替わる。source 自体は 10ms 程度で、fork も走らない。
#
# PURE_* の設定変数は sync.zsh にある。
#
# async.zsh が先。pure.zsh は読み込み時に async の関数を参照する。
[plugins.pure]
github = "sindresorhus/pure"
use = ["async.zsh", "pure.zsh"]
