  # run_once_after_02_execute_brew_bundle.sh.tmpl で trust してから tap する
  taps:
    mac:
      - felixkratz/formulae
  packages:
    common:
      - chezmoi
      - sheldon
      - deno
      - mise
      - bat
      - fd
      - fzf
      - git
      - ghq
      - neovim
      - jq
      - eza
      - ripgrep
      - procs
