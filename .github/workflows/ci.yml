name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # macOS (arm64 / amd64) と Ubuntu の実ランナー上で chezmoi のテンプレート展開を検証する。
  # .chezmoi.os / .chezmoi.arch は execute-template で偽装できないため、OS ごとに実機で回す。
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux / amd64
          - macos-latest # darwin / arm64 (Apple Silicon)
          - macos-15-intel # darwin / amd64 (Intel)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ubuntu ランナーには shellcheck がプリインストールされている
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # .chezmoi.toml.tmpl を promptBool の両分岐で展開し、分岐が展開結果に反映されて
      # いることをアサートする (--promptBool はプロンプト文言が一致しないとエラーに
      # ならず黙って false になるため、展開が成功するだけでは検証にならない)。
      # あわせて後続の execute-template が参照する chezmoi.toml (brew.path など) を生成する
      - name: Verify .chezmoi.toml.tmpl and generate config
        run: |
          tmpcfg="$(mktemp -d)"
          for v in true false; do
            chezmoi execute-template --init --source "$GITHUB_WORKSPACE" \
              --promptBool "Do you want to install external casks=$v" \
              < .chezmoi.toml.tmpl > "$tmpcfg/$v.toml"
          done
          grep -qF 'external = []' "$tmpcfg/false.toml" || {
            echo "NG: promptBool=false で external casks が空リストにならない" >&2
            exit 1
          }
          if grep -qF 'external = []' "$tmpcfg/true.toml"; then
            echo "NG: promptBool=true が展開結果に反映されていない (プロンプト文言の不一致?)" >&2
            exit 1
          fi
          echo "OK: .chezmoi.toml.tmpl (promptBool 両分岐)"
          chezmoi init --source "$GITHUB_WORKSPACE" \
            --promptBool "Do you want to install external casks=true"

      # .chezmoiignore / .chezmoiremove は拡張子に関係なく常にテンプレートとして
      # 解釈されるため、*.tmpl と同様に検証対象へ含める
      - name: Verify all templates render
        run: |
          rc=0
          while IFS= read -r f; do
            if chezmoi execute-template --source "$GITHUB_WORKSPACE" < "$f" > /dev/null; then
              echo "OK: $f"
            else
              echo "NG: $f"
              rc=1
            fi
          done < <(find . \( -name '*.tmpl' -o -name '.chezmoiignore' -o -name '.chezmoiremove' \) \
                     ! -name '.chezmoi.toml.tmpl' ! -path './.git/*' | sort)
          exit "$rc"

      - name: Shellcheck rendered .chezmoiscripts
        run: |
          tmpdir="$(mktemp -d)"
          for f in .chezmoiscripts/*.sh.tmpl; do
            out="$tmpdir/$(basename "${f%.tmpl}")"
            chezmoi execute-template --source "$GITHUB_WORKSPACE" < "$f" > "$out"
            echo "rendered: $f"
          done
          shellcheck "$tmpdir"/*.sh

      # 属性プレフィックス (create_ / executable_ など) の誤りや .chezmoiignore の
      # パターンずれはテンプレート展開では捕まらないので、実際に apply して確かめる。
      # スクリプトは brew install などの副作用を伴うため --exclude scripts で外す
      # (スクリプト本文の検証は上の shellcheck が担当する)。
      # 配置先は使い捨ての一時ディレクトリで、ランナーの $HOME には触らない
      - name: Verify chezmoi apply
        run: |
          dest="$(mktemp -d)"
          echo "APPLY_DEST=$dest" >> "$GITHUB_ENV"
          chezmoi apply --source "$GITHUB_WORKSPACE" --destination "$dest" --exclude scripts
          # 冪等性の確認。apply 済みの配置先に対して status が何か報告するなら、
          # 展開結果が非決定的か、書けていないエントリがある
          st="$(chezmoi status --source "$GITHUB_WORKSPACE" --destination "$dest" --exclude scripts)"
          if [ -n "$st" ]; then
            printf 'NG: apply 後も status が差分を報告する\n%s\n' "$st" >&2
            exit 1
          fi
          echo "OK: chezmoi apply --destination $dest"

      - name: Verify applied attributes and .chezmoiignore
        run: |
          rc=0

          # executable_ が実行ビットになっているか。ソース名から配置先への変換は
          # chezmoi 自身に解決させ、プレフィックスの規則を CI 側に複製しない
          while IFS= read -r src; do
            tgt="$(chezmoi target-path --source "$GITHUB_WORKSPACE" \
                     --destination "$APPLY_DEST" "$src")"
            if [ -x "$tgt" ]; then
              echo "OK: executable $src"
            else
              echo "NG: 実行ビットが立っていない $src -> $tgt" >&2
              rc=1
            fi
          done < <(find . -path ./.git -prune -o -type f -name '*executable_*' -print | sort)

          # 属性プレフィックスの綴りを間違えると (creat_ / exectuable_ など) chezmoi は
          # ただの名前として扱い、そのまま配置先のファイル名に残る。配置後の名前が
          # `xxx_` で始まっていたらこれを疑う (正当な配置先に該当する名前は無い)
          while IFS= read -r -d '' f; do
            if [[ "$(basename "$f")" =~ ^[a-z]+_ ]]; then
              echo "NG: 属性プレフィックスの綴り間違いに見える: ${f#"$APPLY_DEST"/}" >&2
              rc=1
            fi
          done < <(find "$APPLY_DEST" -mindepth 1 -print0)

          # .chezmoiignore に書いたリポジトリ用のファイルが配置されていないこと
          for f in README.md CLAUDE.md; do
            if [ -e "$APPLY_DEST/$f" ]; then
              echo "NG: .chezmoiignore で除外したはずの $f が配置された" >&2
              rc=1
            else
              echo "OK: ignored $f"
            fi
          done

          # 06 は darwin 限定。.chezmoiignore のパターンはソース名ではなく展開後の
          # ターゲット名で書く必要があり、間違えても静かに無視されるので managed で見る
          # (grep -q にパイプで渡すと pipefail 下で上流が SIGPIPE で落ちうるので、
          # いったん変数に受けてから照合する)
          target=".chezmoiscripts/06_check_1password_ssh_agent.sh"
          scripts="$(chezmoi managed --source "$GITHUB_WORKSPACE" \
                       --destination "$APPLY_DEST" --include=scripts)"
          if grep -qxF "$target" <<< "$scripts"; then
            managed=yes
          else
            managed=no
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            want=yes
          else
            want=no
          fi
          if [ "$managed" = "$want" ]; then
            echo "OK: $target managed=$managed ($RUNNER_OS)"
          else
            echo "NG: $target が $RUNNER_OS で managed=$managed (期待は $want)" >&2
            rc=1
          fi

          exit "$rc"

      # テンプレートでない生のシェルスクリプト (dot_config/borders/executable_bordersrc
      # など) は rendered .chezmoiscripts の shellcheck では拾えない。配置結果を走査して
      # shebang が sh / bash のものを対象にする (zsh は shellcheck が扱えないので除く)
      - name: Shellcheck applied shell scripts
        run: |
          files=()
          while IFS= read -r -d '' f; do
            case "$(head -n 1 "$f")" in
              '#!'*/sh | '#!'*/sh\ * | '#!'*/bash | '#!'*/bash\ * | \
                '#!'*env\ sh* | '#!'*env\ bash*)
                files+=("$f")
                ;;
            esac
          done < <(find "$APPLY_DEST" -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NG: shebang 付きのシェルスクリプトが 1 つも見つからない (走査が壊れている?)" >&2
            exit 1
          fi
          # shebang があるのに実行できない = ソース側で executable_ の付け忘れ
          rc=0
          for f in "${files[@]}"; do
            [ -x "$f" ] || {
              echo "NG: shebang 付きだが実行ビットが無い: ${f#"$APPLY_DEST"/} (executable_ の付け忘れ?)" >&2
              rc=1
            }
          done
          printf 'checking: %s\n' "${files[@]}"
          shellcheck "${files[@]}"
          exit "$rc"

  data-syntax:
    name: data syntax (.chezmoidata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # chezmoi は .chezmoidata/ から .yaml / .yml / .json / .toml をすべて読むので
      # 全形式を検証する。pip の --break-system-packages は PEP 668 (externally-managed)
      # な system Python へのフォールバックインストール用
      - name: Validate .chezmoidata data files
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --quiet --break-system-packages pyyaml
          shopt -s nullglob
          files=(.chezmoidata/*.yaml .chezmoidata/*.yml .chezmoidata/*.json .chezmoidata/*.toml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "NG: .chezmoidata に検証対象のデータファイルがない" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *.yaml | *.yml) python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" ;;
              *.json) python3 -c "import sys, json; json.load(open(sys.argv[1]))" "$f" ;;
              *.toml) python3 -c "import sys, tomllib; tomllib.load(open(sys.argv[1], 'rb'))" "$f" ;;
            esac
            echo "OK: $f"
          done
